name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - name: Validate
        run: |
          pnpm check
          python -m py_compile main.py
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")"
          git merge-base --is-ancestor HEAD origin/main
      - name: Package
        run: bash build.sh
      - name: Verify archive
        run: |
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile("out/BGFX.zip") as archive:
              required = {"BGFX/dist/index.js", "BGFX/main.py", "BGFX/package.json",
                          "BGFX/plugin.json", "BGFX/LICENSE", "BGFX/logo.png"}
              files = {item.filename for item in archive.infolist() if not item.is_dir()}
              assert files == required, files ^ required
              assert archive.testzip() is None
          PY
          cd out
          sha256sum BGFX.zip > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: BGFX-${{ github.sha }}
          path: |
            out/BGFX.zip
            out/SHA256SUMS
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BGFX-${{ github.sha }}
          path: out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes out/BGFX.zip out/SHA256SUMS
